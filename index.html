<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rogelio Tower Defense</title>
    
    <!-- Estilos principales -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Estilos críticos para carga inicial */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-text {
            font-family: 'Press Start 2P', cursive;
            color: #ffd700;
            font-size: 24px;
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Pantalla de carga -->
    <div id="loadingScreen">
        <div class="loading-text">CARGANDO...</div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Scripts del juego -->
    <script src="js/sprites.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/game.js"></script>
    
    <script>
        // Esperar a que cargue todo el contenido incluyendo sprites
        window.addEventListener('load', async function() {
            // Inicializar sistema de partículas
            if (typeof ParticleSystem !== 'undefined') {
                ParticleSystem.init();
                console.log('[LOAD] Sistema de partículas inicializado');
            }
            
            // Inicializar sistema de efectos visuales
            if (typeof VisualEffects !== 'undefined') {
                VisualEffects.init();
                console.log('[LOAD] Sistema de efectos visuales inicializado');
            }
            
            // Precargar sprites antes de mostrar el juego
            if (typeof SpriteManager !== 'undefined') {
                console.log('[LOAD] Precargando sprites...');
                await SpriteManager.preloadAll();
                console.log('[LOAD] Sprites precargados!');
            }
            
            // Ocultar pantalla de carga
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500);
            
            // Inicializar menú
            if (typeof initMenu === 'function') {
                initMenu();
            }
        });
    </script>
</body>
</html>
